---
name: Nightly

"on":
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.14"

jobs:
  long-tests:
    name: Long-running tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run extended pytest
        run: uv run pytest -m slow --runslow
        continue-on-error: true

  build-smoke:
    name: Build smoke
    runs-on: ubuntu-latest
    # Keep opt-in until the native build definition lands in S06.
    if: ${{ vars.COBRA_ENABLE_BUILD == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build smoke
        run: bash scripts/ci/build-smoke.sh
