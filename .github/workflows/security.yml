---
name: Security

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # C++/CUDA sources are introduced in S06; analyzing an empty C++
        # database is a CodeQL fatal error, so keep the matrix source-backed.
        language: [python]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          # Code scanning is not enabled for this repository yet.  Keep the
          # local analysis as a required CI check without attempting an upload
          # that GitHub rejects before the repository setting is enabled.
          upload: false
